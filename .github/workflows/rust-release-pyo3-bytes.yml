name: Publish pyo3-bytes to crates.io
on:
  push:
    # Triggers when pushing tags starting with 'pyo3-bytes-v'
    tags: ["pyo3-bytes-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional: for enhanced security
    environment: rust-release-pyo3-bytes
    permissions:
      id-token: write # Required for OIDC token exchange
    steps:
      - uses: actions/checkout@v7
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth
      - run: cargo publish --manifest-path pyo3-bytes/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
